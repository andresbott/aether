Server:
  Port: 8075
  BindIp: ""

# Observability endpoints (health, Prometheus metrics) on a separate server.
# Disabled by default; set Enabled to true to start it.
Observability:
  Enabled: false
  Port: 9009
  BindIp: ""

DataDir: "./data"

# Authentication. Method "none" requires no authentication; "native" uses
# users stored in the aether database; "proxy-header" trusts identity headers
# injected by an authenticating reverse proxy (see zarf/packaging/config.yaml
# for the ProxyHeader options). With "native", the admin user below is
# seeded only while the user store is empty (idempotent bootstrap) — changing
# these values later has no effect on an already-seeded store. AdminPassword
# may be plaintext or a bcrypt hash (generate one with `aether user hash`);
# a value starting with "@" is loaded from that file's content.
Auth:
  Method: "native"
  AdminUser: "admin"
  AdminPassword: "admin"

Env:
  LogLevel: "info"
  Production: false

TaskRunner:
  Parallelism: 2
  QueueSize: 20
  HistorySize: 50
  TagReadWorkers: 0
  # Directory for per-execution task logs. Empty -> <DataDir>/task-logs.
  LogDir: ""

# Artist image fetching. Provide at least one provider API key to enable it.
# A value starting with "@" is loaded from that file's content (path relative to
# the working directory); these .key files are gitignored. Leave a key file empty
# to disable that provider — with both empty, the "fetch-artist-images" task
# reports a "not configured" message when run.
ArtistImages:
  FanartApiKey: "@FanartApiKey.api.key"
  TheAudioDBApiKey: "@TheAudioDBApiKey.api.key"
