version: "2"
linters:
  default: standard # errcheck,govet,ineffassign,staticcheck,unused
  enable:
    - nolintlint
    - gocyclo
    - nestif
    - gosec
    - dupl

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - noop
          - nestif
          - dupl
          - gosec
      # gosec taint analysis (G703 path traversal, G705 XSS) and unbounded-form
      # parsing (G120) flag the media-serving handlers, but served paths come
      # from the trusted DB (clients supply only a numeric ID, never a path),
      # responses are images or text/plain (never HTML), and request bodies are
      # bounded via http.MaxBytesReader. Scoped to these two files only.
      - path: 'app/router/handlers/subsonic/(media|radio)\.go'
        linters:
          - gosec
        text: 'G703|G705|G120'
      # Vendored third-party code
      - path: 'webui/node_modules/'
        linters:
          - gocyclo
          - nestif
          - gosec
          - errcheck
          - govet
          - staticcheck
          - unused

  settings:
    nolintlint:
      allow-no-explanation: []
      require-explanation: true
      require-specific: true
    gocyclo:
      min-complexity: 20  # Default: 30 (but we recommend 10-20)
    gocognit:
      min-complexity: 20  # Default: 30 (but we recommend 10-20)
    nestif:
      min-complexity: 5   # Default: 5


output:
  sort-order:
    - file
    - severity
    - linter
