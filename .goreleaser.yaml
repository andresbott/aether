version: 2
builds:
  # =====================================================================================
  # Linux build — baseline (GOAMD64 v1). Runs on any x86-64 CPU ever made, plus
  # arm64. This is the safe default users should pick unless they know better.
  # The v3 variant lives in linux-opt below; only v1 and v3 are published — v2
  # adds little over v1, and v4 (AVX-512) would not start on Intel 12th-15th gen
  # consumer CPUs, which fuse AVX-512 off. Go selects the level at compile time
  # with no runtime fallback: a too-new binary dies with SIGILL at startup.
  # =====================================================================================
  - id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/andresbott/aether/app/metainfo.Version={{.Version}}
      - -X github.com/andresbott/aether/app/metainfo.BuildTime={{.Date}}
      - -X github.com/andresbott/aether/app/metainfo.ShaVer={{.Commit}}
    binary: aether
    # Pure Go: the SQLite driver (glebarez/modernc) and taglib (wazero/wasm)
    # need no C toolchain. CGO_ENABLED=0 yields a static binary with no glibc
    # floor, so the same artifact runs on Debian 12, older distros and Alpine.
    # Verify with `make verify` before reintroducing CGO for any dependency.
    env:
      - CGO_ENABLED=0

  # =====================================================================================
  # Linux build — GOAMD64 v3 (AVX2/BMI2: Intel Haswell 2013+, AMD Zen 2017+).
  # Packaged as both zip and deb, same as the baseline.
  # =====================================================================================
  - id: linux-opt
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v3
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/andresbott/aether/app/metainfo.Version={{.Version}}
      - -X github.com/andresbott/aether/app/metainfo.BuildTime={{.Date}}
      - -X github.com/andresbott/aether/app/metainfo.ShaVer={{.Commit}}
    binary: aether
    env:
      - CGO_ENABLED=0

  # =====================================================================================
  # Windows build
  # =====================================================================================
  - id: windows
    goos:
      - windows
    goarch:
      - amd64
    goamd64:
      - v1
      - v3
    ldflags:
      - -s -w
      - -X github.com/andresbott/aether/app/metainfo.Version={{.Version}}
      - -X github.com/andresbott/aether/app/metainfo.BuildTime={{.Date}}
      - -X github.com/andresbott/aether/app/metainfo.ShaVer={{.Commit}}
    flags:
      - -trimpath
    binary: aether
    env:
      - CGO_ENABLED=0

archives:
  - formats: [zip]
    name_template: >-
      aether_
      {{- title .Os  }}_
      {{- if eq .Arch "amd64" }}x86_64_{{ .Amd64 }}
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

nfpms:
  -
    id: aether
    package_name: aether
    ids:
      - linux
      - linux-opt
    # A .deb's Architecture field cannot express an amd64 micro-level, so both
    # amd64 debs declare Architecture: amd64 and are told apart by filename
    # only. Fine for direct download (GitHub release); if these are ever served
    # from an apt repository the v3 deb must be dropped or moved to its own
    # suite, since apt would see two candidates for the same package+arch.
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}amd64_{{ .Amd64 }}
      {{- else }}{{ .Arch }}{{ end }}

    maintainer: "Andres Bott <contact@andresbott.com>"
    homepage: https://github.com/andresbott/aether
    license: AGPL-3.0
    section: sound
    description: |
      Music server with a web player and an OpenSubsonic-compatible API.
      Scans a local music library and serves it to the built-in web UI and to
      third-party Subsonic/OpenSubsonic clients. Ships as a single binary with
      the SPA embedded.
    formats:
      - deb

    # The binary is static (CGO_ENABLED=0), so there is no libc dependency.
    # Both of these are optional at runtime — the server starts without them and
    # degrades the affected feature — but apt installs recommends by default, so
    # a plain `apt install aether` gets the complete feature set.
    #   ffmpeg                provides ffprobe, the fallback tag reader for
    #                         formats taglib does not handle
    #                         (internal/tags/ffprobe.go); absent, the scanner
    #                         degrades to taglib-only.
    #   libchromaprint-tools  provides fpcalc, used for AcoustID audio
    #                         identification (libs/fpcalc); absent, the
    #                         metadata editor hides Identify entirely.
    recommends:
      - ffmpeg
      - libchromaprint-tools

    contents:
      - src: README.md
        dst: /usr/share/doc/aether/README.md
      - src: LICENSE
        dst: /usr/share/doc/aether/LICENSE
      - src: zarf/packaging/aether.service
        dst: /lib/systemd/system/aether.service
      - src: zarf/packaging/config.yaml
        dst: /etc/aether/config.yaml
        type: config|noreplace
      # Created by postinstall with aether:aether ownership; declared here so
      # dpkg tracks it and `dpkg -P` can clean up the empty directory.
      - dst: /var/lib/aether
        type: dir
        file_info:
          mode: 0750

    scripts:
      preinstall: zarf/packaging/preinstall.sh
      postinstall: zarf/packaging/postinstall.sh
      preremove: zarf/packaging/preremove.sh
      postremove: zarf/packaging/postremove.sh

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
