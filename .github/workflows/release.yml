name: Release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write
  packages: write   # push the container image to ghcr.io

jobs:
  # ===========================================================================
  # Linux + Windows (runs on Ubuntu, creates the GitHub release)
  # ===========================================================================
  release-linux:
    runs-on: ubuntu-latest
    # Pure-Go builds (CGO_ENABLED=0 in .goreleaser.yaml) produce static binaries
    # with no glibc floor, so the runner image no longer constrains which
    # distributions the artifacts run on and no cross-compilers are needed.
    env:
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install NPM dependencies
        working-directory: webui
        run: npm ci

      - name: Build frontend
        run: make package-ui

      # The container image (dockers_v2) is multi-arch; QEMU runs the arm64
      # stage's `apk add` on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Docs site (site/) to GitHub Pages, once the release exists. Skipped for
  # prereleases (v1.2.3-rc1) so the live site describes the latest stable
  # release. See site.yml for the one-time Pages setup it needs.
  # ===========================================================================
  site:
    needs: release-linux
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # ===========================================================================
  # macOS (runs on macOS, appends to existing release)
  # ===========================================================================
  release-darwin:
    needs: release-linux
    runs-on: macos-latest
    env:
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install NPM dependencies
        working-directory: webui
        run: npm ci

      - name: Build frontend
        run: make package-ui

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Desktop player (player/, Tauri): one bundle job per OS/arch, uploaded to
  # the release the Linux job created. deb + AppImage, an NSIS installer and a
  # dmg per Mac arch — docs/agents/releasing.md says why these and not others.
  # ===========================================================================
  player:
    needs: release-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Ubuntu GitHub still hosts: the deb and the AppImage link
          # against the runner's glibc and webkit2gtk, so building here keeps
          # them installable on Debian 12 / Ubuntu 22.04 and newer.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One set of steps for all three OSes (Windows defaults to PowerShell).
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Same list as player.yml plus patchelf for the AppImage.
      - name: Install system dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            webui/package-lock.json
            player/package-lock.json

      - name: Install NPM dependencies
        run: |
          npm --prefix webui ci
          npm --prefix player ci

      # The version is the tag's (v1.2.3 → 1.2.3), overriding the 0.1.0 in
      # tauri.conf.json. `tauri build` runs the webui production build itself
      # (beforeBuildCommand) and embeds webui/dist.
      - name: Build bundles
        working-directory: player
        run: |
          version="${GITHUB_REF_NAME#v}"
          target_flag=""
          if [ -n "${{ matrix.target }}" ]; then
            target_flag="--target ${{ matrix.target }}"
          fi
          npx tauri build --bundles "${{ matrix.bundles }}" $target_flag --config "{\"version\":\"$version\"}"

      # --clobber: a rerun replaces the files instead of failing on them.
      - name: Upload bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle_dir="player/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          files=("$bundle_dir"/deb/*.deb "$bundle_dir"/appimage/*.AppImage "$bundle_dir"/nsis/*-setup.exe "$bundle_dir"/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no bundles found under $bundle_dir"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
