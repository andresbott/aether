# Aether server configuration (package defaults).
#
# Loaded automatically from /etc/aether/config.yaml. Every value can also be set
# via environment variables prefixed with AETHER_ (e.g. AETHER_SERVER_PORT=8080),
# which take precedence over this file.
#
# This file is marked as a dpkg conffile: your edits survive package upgrades.

Server:
  Port: 8075
  # Bind address. Empty means all interfaces. Set to 127.0.0.1 when a reverse
  # proxy (nginx/Traefik/Caddy, optionally with Authelia) fronts the server.
  BindIp: ""

# Observability endpoints (health, metrics). Off by default; when enabled, keep
# it off the public interface.
Observability:
  Enabled: false
  Port: 9009
  BindIp: "127.0.0.1"

# Database, cached artwork and task logs live here. Owned by the aether user.
DataDir: "/var/lib/aether"

# Authentication. Method "none" requires no authentication (trusted LAN only);
# "native" uses users stored in the aether database; "proxy-header" trusts
# identity headers injected by an authenticating reverse proxy (e.g. Authelia).
# With "native", the admin user below is seeded only while the user store is
# empty (idempotent bootstrap) — changing these values later has no effect on
# an already-seeded store. Prefer a bcrypt hash over a plaintext password in
# this world-readable file (generate one with `aether user hash`), or
# reference a root-only file: "@/etc/aether/admin.password".
#
# With "proxy-header", aether MUST be unreachable except through the proxy
# (bind to 127.0.0.1 above), the proxy MUST strip inbound identity headers on
# every request, and /rest MUST be bypassed at the proxy so Subsonic clients
# can authenticate with their apiKey. Users are created automatically on first
# sight; members of AdminGroup (per the groups header) are admins.
Auth:
  Method: "none"
  AdminUser: "admin"
  AdminPassword: "admin"
  # Only used with Method "proxy-header". Header names below match Authelia;
  # for oauth2-proxy use X-Forwarded-User / X-Forwarded-Groups.
  ProxyHeader:
    UserHeader: "Remote-User"
    GroupsHeader: "Remote-Groups"
    AdminGroup: "aether-admin"
    # CIDRs (or bare IPs) allowed to assert identity headers. Strongly
    # recommended; empty trusts every peer that can reach the server.
    TrustedProxies: []

Env:
  LogLevel: "info"
  Production: true

TaskRunner:
  Parallelism: 2
  QueueSize: 20
  HistorySize: 50
  # 0 -> derived from the CPU count.
  TagReadWorkers: 0
  # Per-execution task logs. Empty -> <DataDir>/task-logs.
  LogDir: ""

# Artist image fetching. Provide at least one provider API key to enable it;
# with both empty the "fetch-artist-images" task reports "not configured".
# A value starting with "@" is read from that file's content, e.g.
# "@/etc/aether/fanart.api.key" — keeps the key out of this world-readable file.
ArtistImages:
  FanartApiKey: ""
  TheAudioDBApiKey: ""
