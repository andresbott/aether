openapi: 3.1.0
info:
  title: Bad bounded-URL fixture
  version: 0.1.0
  description: >
    Negative fixture for the `no-array-in-get-delete-url` Spectral rule
    (see ../../../.spectral.yaml). This document MUST fail
    `spectral lint -r .spectral.yaml` — it exists to prove the rule fires,
    not to describe a real endpoint. Kept under `testdata/` so the normal
    `make spec-lint` gate (which lints only `docs/openapi/aether-v1.yaml`)
    never touches it.
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: Lists widgets filtered by a repeated query array — the violation under test.
      description: >
        A GET carrying a variable-length list (`ids`) as an `in: query` array
        parameter — exactly the header-unsafe shape that caused the
        production 431 (Caddy forward_auth + Authelia) this rule guards
        against. `no-array-in-get-delete-url` must reject this.
      parameters:
        - name: ids
          in: query
          required: false
          description: Repeated widget ids — the array-typed query param the rule must catch.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgets:
                    type: array
                    items:
                      type: string
                required: [widgets]
